# VIPERS HOSPITAL overrides on top of the official bahmni-lite docker-compose.yml.
# Bahmni's own TLS endpoints are bound to localhost only; the public edge (Caddy) is the only
# service listening on the internet. Use with:
#   docker compose --env-file .env.vipers -f docker-compose.yml -f docker-compose.vipers.yml ...
services:
  proxy:
    ports: !override
      - "127.0.0.1:8443:443"
    restart: unless-stopped

  crater-nginx:
    ports: !override
      - "127.0.0.1:8444:443"
    volumes:
      # access log without query strings (the Bahmni sync sends credentials as URL parameters)
      - /opt/vipers/branding/crater-nginx.conf:/etc/nginx/conf.d/nginx.conf:ro

  crater-php:
    restart: unless-stopped

  # reports signs in to OpenMRS as reports-user; its stock template hard-codes the public default password.
  # Use a template whose password comes from REPORTS_SERVICE_PASSWORD (set by 04-harden.sh in .env.vipers).
  reports:
    environment:
      REPORTS_SERVICE_PASSWORD: ${REPORTS_SERVICE_PASSWORD:-}
    volumes:
      - /opt/vipers/branding/bahmni-reports.properties.template:/etc/bahmni-reports/bahmni-reports.properties.template:ro

  openmrsdb:
    restart: unless-stopped
  craterdb:
    restart: unless-stopped

  # bahmni-config re-copies its stock config on every start; apply the VIPERS overlay afterwards
  bahmni-config:
    volumes:
      - /opt/vipers/branding/config-overlay:/etc/vipers_overlay:ro
    entrypoint: ["/bin/sh", "-c", "cp -r /etc/bahmni_config /usr/local/ && cp -r /etc/vipers_overlay/. /usr/local/bahmni_config/ && echo 'VIPERS overlay applied' && exec sleep infinity"]
