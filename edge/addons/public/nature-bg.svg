<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMax slice">
  <!-- VIPERS natural background: morning sky, misty hills, acacia trees (drawn in-house, no stock imagery) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ecf2"/>
      <stop offset=".45" stop-color="#eef6f3"/>
      <stop offset=".7" stop-color="#fbf6e8"/>
    </linearGradient>
    <radialGradient id="sun" cx="1220" cy="430" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff4cf" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#fdeec0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#fdeec0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8d4d0"/><stop offset="1" stop-color="#cfe2db"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbfa6"/><stop offset="1" stop-color="#a9cfb3"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f9e7c"/><stop offset="1" stop-color="#4c8a6a"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7d5f"/><stop offset="1" stop-color="#2f6a4f"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f9f7" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f9f7" stop-opacity=".75"/>
    </linearGradient>
    <g id="acacia">
      <path d="M0 0 C-2 -30 -6 -55 -18 -80 M0 0 C3 -35 8 -60 22 -84 M-2 -40 C8 -55 14 -62 30 -70" stroke="#2c5d45" stroke-width="5" fill="none" stroke-linecap="round"/>
      <ellipse cx="2" cy="-92" rx="70" ry="16" fill="#2f6a4f"/>
      <ellipse cx="-18" cy="-100" rx="42" ry="11" fill="#3a7758"/>
      <ellipse cx="30" cy="-98" rx="38" ry="10" fill="#3a7758"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>

  <!-- soft clouds -->
  <g fill="#ffffff" opacity=".7">
    <ellipse cx="260" cy="170" rx="150" ry="26"/><ellipse cx="330" cy="150" rx="90" ry="24"/>
    <ellipse cx="980" cy="110" rx="120" ry="20"/><ellipse cx="1040" cy="95" rx="70" ry="18"/>
    <ellipse cx="1420" cy="230" rx="110" ry="18"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#4f6f6a" stroke-width="2.2" stroke-linecap="round" opacity=".55">
    <path d="M1080 300 q10 -9 20 0 q10 -9 20 0"/>
    <path d="M1130 270 q7 -6 14 0 q7 -6 14 0"/>
    <path d="M1040 330 q6 -5 12 0 q6 -5 12 0"/>
  </g>

  <!-- far misty ridge -->
  <path d="M0 640 C140 590 260 600 380 570 C520 535 640 590 780 560 C930 528 1050 575 1190 545 C1330 515 1460 560 1600 530 L1600 1000 L0 1000Z" fill="url(#far)"/>
  <rect y="560" width="1600" height="160" fill="url(#mist)"/>

  <!-- middle hills -->
  <path d="M0 720 C160 670 300 690 450 660 C620 626 760 700 930 672 C1100 644 1240 690 1400 662 C1480 648 1550 655 1600 650 L1600 1000 L0 1000Z" fill="url(#mid)"/>

  <!-- near hills with acacia trees -->
  <path d="M0 800 C200 760 360 780 540 752 C740 722 900 790 1100 768 C1290 748 1440 770 1600 748 L1600 1000 L0 1000Z" fill="url(#near)"/>
  <use href="#acacia" transform="translate(1270 760) scale(.9)"/>
  <use href="#acacia" transform="translate(1390 752) scale(.6)"/>
  <use href="#acacia" transform="translate(250 778) scale(.7)"/>

  <!-- front meadow -->
  <path d="M0 890 C240 850 470 880 700 862 C950 842 1180 890 1400 868 C1490 860 1550 862 1600 858 L1600 1000 L0 1000Z" fill="url(#front)"/>
  <g stroke="#2a5c44" stroke-width="2" stroke-linecap="round" opacity=".55">
    <path d="M120 900 l-4 -16 M126 900 l2 -18 M132 900 l6 -14"/>
    <path d="M820 880 l-4 -15 M826 880 l2 -17 M832 880 l6 -13"/>
    <path d="M1500 875 l-4 -15 M1506 875 l2 -17 M1512 875 l6 -13"/>
  </g>
</svg>
